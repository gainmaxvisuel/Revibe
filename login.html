<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revibe — Connexion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#03140a;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .box{
      width:100%;
      max-width:420px;
      background:#071d11;
      border:1px solid #123b24;
      border-radius:18px;
      padding:28px 22px;
    }
    .logo{
      width:55px;height:55px;
      margin:auto;
      border-radius:16px;
      background:#10b981;
      color:#03140a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:900;
    }
    h1{text-align:center;margin-top:16px}
    .sub{text-align:center;color:#8fa99a;margin:8px 0 25px}
    label{display:block;margin:15px 0 7px;font-size:14px}
    input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:1px solid #245438;
      background:#03140a;
      color:white;
      outline:none;
    }
    input:focus{border-color:#10b981}
    .pass{position:relative}
    .pass button{
      position:absolute;
      right:10px;
      top:8px;
      background:none;
      border:0;
      color:#9bb5a5;
      padding:7px;
      cursor:pointer;
    }
    .forgot{
      display:block;
      text-align:right;
      margin-top:10px;
      color:#10b981;
      font-size:13px;
      text-decoration:none;
    }
    .login{
      width:100%;
      margin-top:22px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#10b981;
      color:#03140a;
      font-weight:bold;
      cursor:pointer;
    }
    .login:disabled{opacity:.6}
    #message{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      color:#ff7777;
    }
    .register{
      text-align:center;
      margin-top:22px;
      color:#8fa99a;
      font-size:14px;
    }
    .register a{color:#10b981;text-decoration:none}
  </style>
</head>

<body>

<div class="box">
  <div class="logo">R</div>

  <h1>Bienvenue sur Revibe</h1>
  <p class="sub">Connectez-vous à votre compte</p>

  <form id="loginForm">

    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      type="email"
      placeholder="vous@example.com"
      required
    >

    <label for="password">Mot de passe</label>
    <div class="pass">
      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        required
      >
      <button type="button" id="toggle">Afficher</button>
    </div>

    <a href="#" class="forgot">Mot de passe oublié ?</a>

    <button class="login" id="loginBtn" type="submit">
      Se connecter
    </button>

    <div id="message"></div>
  </form>

  <div class="register">
    Vous n'avez pas encore de compte ?
    <a href="index.html">Créer un compte</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cmtbzozflkmxfhdzlgab.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZzqLlH7Iz10HBq8SGoXdmA_l1XhBl7T";

const { createClient } = supabase;

const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: false,
    autoRefreshToken: false,
    detectSessionInUrl: false
  }
});

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const message = document.getElementById("message");

document.getElementById("toggle").onclick = () => {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
};

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  message.textContent = "";
  btn.disabled = true;
  btn.textContent = "Connexion...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await db.rpc("login_user", {
      p_email: email,
      p_password: password
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (!result || !result.session_token) {
      throw new Error("Identifiants incorrects.");
    }

    localStorage.setItem(
      "revibe_session_token",
      result.session_token
    );

    const role = result.role;

    if (role === "seller") {
      window.location.href = "seller/profile.html";
    } else if (role === "driver") {
      window.location.href = "driver/profile.html";
    } else {
      window.location.href = "client/index.html";
    }

  } catch (err) {
    message.textContent =
      err.message || "Impossible de vous connecter.";
    btn.disabled = false;
    btn.textContent = "Se connecter";
  }
});
</script>

</body>
</html>
